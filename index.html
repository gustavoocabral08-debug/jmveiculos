<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JM Veículos - Concessionária</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        .cinzel-text { font-family: 'Cinzel', serif; }
        .toast { position: fixed; bottom: 20px; right: 20px; background: #10b981; color: white; padding: 12px 24px; border-radius: 8px; animation: slideIn 0.3s ease; z-index: 1000; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { background: white; border-radius: 12px; max-width: 700px; width: 90%; max-height: 85vh; overflow-y: auto; padding: 24px; }
        .dark-mode { background-color: #0f172a !important; color: #e2e8f0 !important; }
        .dark-mode .bg-white { background-color: #1e293b !important; }
        .dark-mode .modal-content { background-color: #1e293b !important; color: #e2e8f0 !important; }
        .dark-mode input, .dark-mode select, .dark-mode textarea { background-color: #0f172a !important; border-color: #334155 !important; color: #e2e8f0 !important; }
        button { cursor: pointer; transition: all 0.2s; }
        button:hover { transform: translateY(-2px); }
        .vehicle-card { transition: transform 0.3s; background: white; border-radius: 12px; overflow: hidden; }
        .dark-mode .vehicle-card { background: #1e293b !important; }
        .vehicle-card:hover { transform: translateY(-5px); box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); }
        .vehicle-image { width: 100%; height: 250px; object-fit: cover; }
        .gallery-image { width: 100%; height: 400px; object-fit: cover; }
        .thumbnail { width: 70px; height: 70px; object-fit: cover; cursor: pointer; border-radius: 8px; border: 2px solid transparent; }
        .thumbnail.active { border-color: #3b82f6; }
        .brand-btn { transition: all 0.2s; }
        .brand-btn:hover { transform: scale(1.05); }
        .preview-image { width: 80px; height: 80px; object-fit: cover; border-radius: 8px; }
        .gallery-preview { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
        .gallery-item { position: relative; }
        .remove-image-btn { position: absolute; top: -8px; right: -8px; background: #ef4444; color: white; border-radius: 50%; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 12px; }
        .hero-section { position: relative; background-image: url('https://images.unsplash.com/photo-1494976388531-d1058494cdd8?w=1600&h=600&fit=crop'); background-size: cover; background-position: center; }
        .hero-section::before { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(135deg, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0.4) 100%); }
        .add-image-btn { background: #3b82f6; color: white; padding: 8px 16px; border-radius: 8px; margin-top: 10px; display: inline-block; cursor: pointer; }
        .add-image-btn:hover { background: #2563eb; }
        .loading { text-align: center; padding: 50px; font-size: 18px; }
    </style>
</head>
<body class="bg-gray-50">
<div id="app"><div class="loading">🔄 Carregando veículos...</div></div>

<script>
    // CONFIGURAÇÕES
    const CLOUDINARY_CLOUD_NAME = 'da1awx24q';
    const CLOUDINARY_UPLOAD_PRESET = 'jm_veiculos';
    const GITHUB_TOKEN = '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';
    const GITHUB_USERNAME = 'gustavoocabral08-debug';
    const GITHUB_REPO = 'jmveiculos';
    const GITHUB_FILE = 'vehicles.json';
    
    const MARCAS = ["Chevrolet", "Volkswagen", "Peugeot", "Toyota", "Fiat", "Renault", "Ford", "Honda", "Hyundai", "Jeep", "Nissan", "Citroen"];
    const ADMIN_EMAIL = 'admin@jmveiculos.com';
    const ADMIN_PASSWORD = '245464Jm<becs$';
    
    let vehicles = [], isAdmin = false, isDarkMode = false, currentPage = 'home', selectedMarca = 'todas', filterStatus = 'todos', selectedVehicle = null, toastMessage = null, showLoginModal = false, showVehicleModal = false, editingVehicle = null, currentImageIndex = 0, isLoading = true, currentSha = null, isUploading = false;
    
    async function uploadImageToCloudinary(file) {
        return new Promise((resolve, reject) => {
            const formData = new FormData();
            formData.append('file', file);
            formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
            const xhr = new XMLHttpRequest();
            xhr.open('POST', `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`, true);
            xhr.onload = () => xhr.status === 200 ? resolve(JSON.parse(xhr.responseText).secure_url) : reject();
            xhr.onerror = () => reject();
            xhr.send(formData);
        });
    }
    
    async function loadVehiclesFromGitHub() {
        try {
            isLoading = true; render();
            const response = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/contents/${GITHUB_FILE}`, {
                headers: { 'Authorization': `token ${GITHUB_TOKEN}`, 'Accept': 'application/vnd.github.v3+json' }
            });
            if (response.ok) {
                const data = await response.json();
                currentSha = data.sha;
                vehicles = JSON.parse(atob(data.content));
                showToast('✅ Dados carregados!');
            } else { loadLocalData(); }
        } catch(e) { loadLocalData(); }
        finally { isLoading = false; render(); }
    }
    
    async function saveVehiclesToGitHub() {
        if (!isAdmin) { saveLocalData(); return; }
        try {
            const content = btoa(unescape(encodeURIComponent(JSON.stringify(vehicles, null, 2))));
            const response = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/contents/${GITHUB_FILE}`, {
                method: 'PUT', headers: { 'Authorization': `token ${GITHUB_TOKEN}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: 'Atualização', content: content, sha: currentSha })
            });
            if (response.ok) { const data = await response.json(); currentSha = data.content.sha; showToast('✅ Salvo no GitHub!'); }
            else { showToast('⚠️ Erro ao salvar', true); saveLocalData(); }
        } catch(e) { showToast('⚠️ Erro', true); saveLocalData(); }
    }
    
    function loadLocalData() {
        const saved = localStorage.getItem('jm_vehicles_local');
        vehicles = saved && JSON.parse(saved).length ? JSON.parse(saved) : [
            { id: 1, nome: "Onix Turbo", marca: "Chevrolet", ano: 2023, preco: 85000, km: 15000, combustivel: "Flex", cambio: "Automático", cor: "Prata", status: "disponível", imagens: ["https://images.unsplash.com/photo-1603584173870-7e23fae7297c?w=800&h=450&fit=crop"], descricao: "Onix LT 1.0 Turbo" },
            { id: 2, nome: "Golf GTI", marca: "Volkswagen", ano: 2022, preco: 165000, km: 35000, combustivel: "Gasolina", cambio: "Automático", cor: "Preto", status: "disponível", imagens: ["https://images.unsplash.com/photo-1568605114967-8130f6a7a7c7?w=800&h=450&fit=crop"], descricao: "Golf GTI 2.0 TSI" },
            { id: 3, nome: "Corolla XEI", marca: "Toyota", ano: 2022, preco: 135000, km: 28000, combustivel: "Flex", cambio: "CVT", cor: "Branco", status: "reservado", imagens: ["https://images.unsplash.com/photo-1621135802920-133df287f89c?w=800&h=450&fit=crop"], descricao: "Corolla XEI completo" },
            { id: 4, nome: "Hilux SRV", marca: "Toyota", ano: 2021, preco: 220000, km: 35000, combustivel: "Diesel", cambio: "Automático", cor: "Prata", status: "disponível", imagens: ["https://images.unsplash.com/photo-1620885019235-bbe289f0ac00?w=800&h=450&fit=crop"], descricao: "Hilux 4x4" },
            { id: 5, nome: "Civic EXL", marca: "Honda", ano: 2020, preco: 110000, km: 45000, combustivel: "Flex", cambio: "Automático", cor: "Preto", status: "vendido", imagens: ["https://images.unsplash.com/photo-1590362891991-f776e747a588?w=800&h=450&fit=crop"], descricao: "Civic EXL" }
        ];
        saveLocalData();
    }
    
    function saveLocalData() { localStorage.setItem('jm_vehicles_local', JSON.stringify(vehicles)); }
    function showToast(msg, isError = false) { toastMessage = { text: msg, isError }; render(); setTimeout(() => { toastMessage = null; render(); }, 3000); }
    function toggleTheme() { isDarkMode = !isDarkMode; localStorage.setItem('jm_darkMode', isDarkMode); render(); }
    function handleLogin(email, pass) { if (email === ADMIN_EMAIL && pass === ADMIN_PASSWORD) { isAdmin = true; showLoginModal = false; currentPage = 'admin'; localStorage.setItem('jm_admin', 'true'); showToast('Login OK!'); render(); } else { showToast('Credenciais inválidas!', true); } }
    function handleLogout() { isAdmin = false; currentPage = 'home'; localStorage.setItem('jm_admin', 'false'); showToast('Logout OK'); render(); }
    async function handleDeleteVehicle(id) { if (confirm('Excluir?')) { vehicles = vehicles.filter(v => v.id !== id); saveLocalData(); if (isAdmin) await saveVehiclesToGitHub(); showToast('Excluído!'); render(); } }
    function handleContact(v) { showToast(`Interesse em ${v.nome}!`); }
    function formatPrice(p) { return 'R$ ' + p.toLocaleString('pt-BR'); }
    function getStatusColor(s) { return s === 'disponível' ? 'bg-green-500' : s === 'reservado' ? 'bg-yellow-500' : 'bg-red-500'; }
    window.selectMarca = function(m) { selectedMarca = m; render(); };
    window.updateFilter = function(s) { filterStatus = s; render(); };
    
    function render() {
        const app = document.getElementById('app');
        if (!app) return;
        if (isDarkMode) document.body.classList.add('dark-mode'); else document.body.classList.remove('dark-mode');
        if (isLoading) { app.innerHTML = '<div class="loading">🔄 Carregando...</div>'; return; }
        
        let html = `<div class="min-h-screen flex flex-col"><nav class="bg-white shadow-md sticky top-0 z-50"><div class="container mx-auto px-4"><div class="flex justify-between items-center h-16"><div class="cursor-pointer" onclick="window.changePage('home')"><span class="text-2xl font-bold"><span style="color:#3b82f6;">JM</span> <span style="color:#6b7280;">VEÍCULOS</span></span></div><div class="flex gap-4"><button onclick="window.changePage('home')" class="px-3 py-2 rounded">🏠 Home</button><button onclick="window.changePage('vehicles')" class="px-3 py-2 rounded">Veículos</button>${isAdmin ? `<button onclick="window.changePage('admin')" class="px-3 py-2 rounded">Admin</button><button onclick="handleLogout()" class="px-3 py-2 rounded bg-red-500 text-white">Sair</button>` : `<button onclick="window.showLogin()" class="px-3 py-2 rounded bg-blue-500 text-white">Admin</button>`}<button onclick="toggleTheme()" class="p-2 rounded">${isDarkMode ? '☀️' : '🌙'}</button></div></div></div></nav><div class="flex-grow">`;
        
        if (currentPage === 'home') {
            const destaques = vehicles.filter(v => v.status === 'disponível').slice(0, 3);
            html += `<div class="hero-section"><div class="relative z-10 container mx-auto px-4 py-24 text-center"><h1 class="cinzel-text text-5xl md:text-7xl font-bold text-white mb-6">Potência, estilo e confiança<br>na sua garagem</h1><p class="text-xl text-gray-200 mb-8">As melhores ofertas com garantia</p><button onclick="window.changePage('vehicles')" class="bg-blue-600 text-white px-8 py-3 rounded-lg">Ver Ofertas</button></div></div>
            <div class="container mx-auto px-4 py-16"><h2 class="text-3xl font-bold text-center mb-12">⭐ Veículos em Destaque</h2><div class="grid md:grid-cols-3 gap-8">${destaques.map(v => `<div class="vehicle-card"><img src="${v.imagens[0]}" class="vehicle-image"><div class="p-5"><h3 class="text-xl font-semibold">${v.nome}</h3><p class="text-gray-600">${v.marca} - ${v.ano}</p><p class="text-blue-600 text-2xl font-bold">${formatPrice(v.preco)}</p><button onclick="window.viewDetail(${v.id})" class="w-full mt-3 bg-blue-500 text-white py-2 rounded">Ver Detalhes</button></div></div>`).join('')}</div></div>
            <div class="py-16 bg-gray-100 dark:bg-gray-800"><div class="container mx-auto px-4"><div class="flex flex-col md:flex-row items-center gap-8"><div class="md:w-1/2 text-center md:text-left"><h2 class="text-3xl font-bold mb-4">🔑 Pronto para começar?</h2><p class="text-lg mb-4">Com a JM Veículos, você está a um passo do carro próprio.</p><button onclick="window.changePage('vehicles')" class="bg-green-600 text-white px-6 py-2 rounded-lg">Quero meu carro</button></div><div class="md:w-1/2"><img src="https://images.unsplash.com/photo-1580273916550-e323be2ae537?w=500&h=400&fit=crop" class="rounded-xl shadow-lg w-full h-64 object-cover"></div></div></div></div>`;
        }
        else if (currentPage === 'vehicles') {
            let filtered = vehicles.filter(v => (selectedMarca === 'todas' || v.marca === selectedMarca) && (filterStatus === 'todos' || v.status === filterStatus));
            html += `<div class="container mx-auto px-4 py-8"><h1 class="text-3xl font-bold mb-8">🚗 Catálogo de Veículos</h1>
            <div class="mb-6"><label class="block mb-2">Filtrar por Marca:</label><div class="flex flex-wrap gap-2"><button onclick="window.selectMarca('todas')" class="brand-btn px-4 py-2 rounded ${selectedMarca === 'todas' ? 'bg-blue-500 text-white' : 'bg-gray-200'}">Todas</button>${MARCAS.map(m => `<button onclick="window.selectMarca('${m}')" class="brand-btn px-4 py-2 rounded ${selectedMarca === m ? 'bg-blue-500 text-white' : 'bg-gray-200'}">${m}</button>`).join('')}</div></div>
            <div class="mb-6"><label class="block mb-2">Filtrar por Status:</label><div class="flex flex-wrap gap-2"><button onclick="window.updateFilter('todos')" class="px-4 py-2 rounded ${filterStatus === 'todos' ? 'bg-blue-500 text-white' : 'bg-gray-200'}">Todos</button><button onclick="window.updateFilter('disponível')" class="px-4 py-2 rounded ${filterStatus === 'disponível' ? 'bg-green-500 text-white' : 'bg-gray-200'}">Disponíveis</button><button onclick="window.updateFilter('reservado')" class="px-4 py-2 rounded ${filterStatus === 'reservado' ? 'bg-yellow-500 text-white' : 'bg-gray-200'}">Reservados</button><button onclick="window.updateFilter('vendido')" class="px-4 py-2 rounded ${filterStatus === 'vendido' ? 'bg-red-500 text-white' : 'bg-gray-200'}">Vendidos</button></div></div>
            <div class="mb-4 text-sm">📊 Mostrando ${filtered.length} de ${vehicles.length} veículos</div><div class="grid md:grid-cols-3 gap-6">${filtered.map(v => `<div class="vehicle-card"><img src="${v.imagens[0]}" class="vehicle-image"><div class="p-5"><div class="flex justify-between"><h2 class="text-xl font-semibold">${v.nome}</h2><span class="px-2 py-1 rounded text-xs text-white ${getStatusColor(v.status)}">${v.status}</span></div><p class="text-gray-600">${v.marca} • ${v.ano} • ${v.km.toLocaleString()} km</p><p class="text-blue-600 text-2xl font-bold">${formatPrice(v.preco)}</p><div class="mt-3 flex gap-2"><button onclick="window.viewDetail(${v.id})" class="flex-1 bg-blue-500 text-white py-2 rounded">Detalhes</button>${v.status === 'disponível' ? `<button onclick="handleContact(${JSON.stringify(v).replace(/"/g, '&quot;')})" class="flex-1 bg-green-500 text-white py-2 rounded">Comprar</button>` : ''}</div></div></div>`).join('')}</div>${filtered.length === 0 ? '<div class="text-center py-12"><p>Nenhum veículo encontrado.</p></div>' : ''}</div>`;
        }
        else if (currentPage === 'detail' && selectedVehicle) {
            html += `<div class="container mx-auto px-4 py-8"><button onclick="window.changePage('vehicles')" class="text-blue-500 mb-4">← Voltar</button><div class="bg-white rounded-xl shadow-lg overflow-hidden"><img src="${selectedVehicle.imagens[currentImageIndex]}" class="gallery-image w-full"><div class="flex gap-2 p-4 overflow-x-auto">${selectedVehicle.imagens.map((img, i) => `<img src="${img}" class="thumbnail ${currentImageIndex === i ? 'active' : ''}" onclick="window.setImageIndex(${i})">`).join('')}</div><div class="p-8"><h1 class="text-3xl font-bold">${selectedVehicle.nome}</h1><p class="text-blue-600 text-4xl font-bold mt-4">${formatPrice(selectedVehicle.preco)}</p><div class="grid md:grid-cols-2 gap-6 mt-6"><div><strong>Marca:</strong> ${selectedVehicle.marca}<br><strong>Ano:</strong> ${selectedVehicle.ano}<br><strong>KM:</strong> ${selectedVehicle.km.toLocaleString()} km<br><strong>Combustível:</strong> ${selectedVehicle.combustivel}<br><strong>Câmbio:</strong> ${selectedVehicle.cambio}<br><strong>Cor:</strong> ${selectedVehicle.cor}</div><div><strong>Descrição:</strong><br>${selectedVehicle.descricao}</div></div><button onclick="handleContact(${JSON.stringify(selectedVehicle).replace(/"/g, '&quot;')})" class="w-full mt-6 bg-green-500 text-white py-3 rounded-lg text-lg">💰 Tenho Interesse</button></div></div></div>`;
        }
        else if (currentPage === 'admin' && isAdmin) {
            html += `<div class="container mx-auto px-4 py-8"><div class="flex justify-between items-center mb-8"><h1 class="text-3xl font-bold">👑 Painel Admin</h1><button onclick="window.openVehicleModal()" class="bg-green-500 text-white px-6 py-2 rounded">+ Novo Veículo</button></div><div class="bg-white rounded-xl shadow-lg overflow-x-auto"><table class="w-full"><thead class="bg-gray-100"><tr><th class="p-3">ID</th><th class="p-3">Imagem</th><th class="p-3">Veículo</th><th class="p-3">Preço</th><th class="p-3">Status</th><th class="p-3">Fotos</th><th class="p-3">Ações</th></tr></thead><tbody>${vehicles.map(v => `<tr class="border-t"><td class="p-3">${v.id}</td><td class="p-3"><img src="${v.imagens[0]}" class="w-12 h-12 object-cover rounded"></td><td class="p-3"><div class="font-bold">${v.nome}</div><div class="text-sm text-gray-600">${v.marca} ${v.ano}</div></td><td class="p-3">${formatPrice(v.preco)}</td><td class="p-3"><select onchange="window.updateStatus(${v.id}, this.value)" class="border rounded p-1"><option ${v.status === 'disponível' ? 'selected' : ''}>disponível</option><option ${v.status === 'reservado' ? 'selected' : ''}>reservado</option><option ${v.status === 'vendido' ? 'selected' : ''}>vendido</option></select></td><td class="p-3">📸 ${v.imagens.length}</td><td class="p-3"><button onclick="window.editVehicle(${v.id})" class="text-blue-600 mr-2">Editar</button><button onclick="handleDeleteVehicle(${v.id})" class="text-red-600">Excluir</button></td></tr>`).join('')}</tbody></table></div></div>`;
        }
        
        html += `</div><footer class="bg-gray-800 text-white py-6 text-center">© 2024 JM Veículos</footer></div>`;
        if (showLoginModal) html += `<div class="modal-overlay" onclick="window.closeLogin()"><div class="modal-content" onclick="event.stopPropagation()"><h2 class="text-2xl font-bold mb-4">Login Admin</h2><form onsubmit="window.submitLogin(event)"><input type="email" id="loginEmail" placeholder="E-mail" class="w-full p-2 border rounded mb-3" required><input type="password" id="loginPass" placeholder="Senha" class="w-full p-2 border rounded mb-3" required><button type="submit" class="w-full bg-blue-500 text-white py-2 rounded">Entrar</button><button type="button" onclick="window.closeLogin()" class="w-full mt-2 bg-gray-500 text-white py-2 rounded">Cancelar</button></form></div></div>`;
        if (showVehicleModal) {
            const v = editingVehicle || { nome: '', marca: MARCAS[0], ano: 2024, preco: 0, km: 0, combustivel: 'Flex', cambio: 'Manual', cor: '', descricao: '', imagens: [] };
            html += `<div class="modal-overlay" onclick="window.closeVehicleModal()"><div class="modal-content" onclick="event.stopPropagation()"><h2 class="text-2xl font-bold mb-4">${editingVehicle ? 'Editar' : 'Novo'} Veículo</h2><form id="vehicleForm"><input type="text" id="nome" placeholder="Nome" value="${v.nome}" class="w-full p-2 border rounded mb-2" required><select id="marca" class="w-full p-2 border rounded mb-2">${MARCAS.map(m => `<option ${v.marca === m ? 'selected' : ''}>${m}</option>`).join('')}</select><div class="grid grid-cols-2 gap-2"><input type="number" id="ano" placeholder="Ano" value="${v.ano}" class="p-2 border rounded" required><input type="number" id="preco" placeholder="Preço" value="${v.preco}" class="p-2 border rounded" required><input type="number" id="km" placeholder="KM" value="${v.km}" class="p-2 border rounded" required><input type="text" id="cor" placeholder="Cor" value="${v.cor}" class="p-2 border rounded" required></div><select id="combustivel" class="w-full p-2 border rounded my-2"><option ${v.combustivel === 'Flex' ? 'selected' : ''}>Flex</option><option ${v.combustivel === 'Gasolina' ? 'selected' : ''}>Gasolina</option><option ${v.combustivel === 'Diesel' ? 'selected' : ''}>Diesel</option></select><select id="cambio" class="w-full p-2 border rounded mb-2"><option ${v.cambio === 'Manual' ? 'selected' : ''}>Manual</option><option ${v.cambio === 'Automático' ? 'selected' : ''}>Automático</option></select><textarea id="descricao" placeholder="Descrição" rows="2" class="w-full p-2 border rounded mb-2">${v.descricao}</textarea><div><label class="block mb-2">📸 Fotos</label><div id="imagePreview" class="gallery-preview">${v.imagens.map(img => `<div class="gallery-item"><img src="${img}" class="preview-image"><div class="remove-image-btn" onclick="this.parentElement.remove()">×</div></div>`).join('')}</div><input type="file" id="vehicleImages" accept="image/*" multiple style="display:none"><button type="button" onclick="document.getElementById('vehicleImages').click()" class="add-image-btn">+ Selecionar Fotos</button></div><div class="flex gap-2 mt-4"><button type="submit" class="flex-1 bg-blue-500 text-white py-2 rounded">Salvar</button><button type="button" onclick="window.closeVehicleModal()" class="flex-1 bg-gray-500 text-white py-2 rounded">Cancelar</button></div></form></div></div>`;
        }
        if (toastMessage) html += `<div class="toast" style="background:${toastMessage.isError ? '#ef4444' : '#10b981'}">${toastMessage.text}</div>`;
        if (isUploading) html += `<div class="fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center z-50"><div class="bg-white dark:bg-gray-800 p-6 rounded-lg text-center"><div class="spinner mb-3">⏳</div><p>Enviando fotos...</p></div></div>`;
        app.innerHTML = html;
        
        if (showVehicleModal) document.getElementById('vehicleImages')?.addEventListener('change', function(e) { Array.from(e.target.files).forEach(f => { const r = new FileReader(); r.onload = ev => { const div = document.createElement('div'); div.className = 'gallery-item'; div.innerHTML = `<img src="${ev.target.result}" class="preview-image"><div class="remove-image-btn" onclick="this.parentElement.remove()">×</div>`; document.getElementById('imagePreview').appendChild(div); }; r.readAsDataURL(f); }); });
    }
    
    window.changePage = (p) => { currentPage = p; selectedVehicle = null; render(); };
    window.viewDetail = (id) => { selectedVehicle = vehicles.find(v => v.id === id); currentImageIndex = 0; currentPage = 'detail'; render(); };
    window.setImageIndex = (i) => { currentImageIndex = i; render(); };
    window.updateStatus = async (id, status) => { const v = vehicles.find(v => v.id === id); if (v) { v.status = status; saveLocalData(); if (isAdmin) await saveVehiclesToGitHub(); render(); showToast('Status atualizado'); } };
    window.showLogin = () => { showLoginModal = true; render(); };
    window.closeLogin = () => { showLoginModal = false; render(); };
    window.submitLogin = (e) => { e.preventDefault(); handleLogin(document.getElementById('loginEmail').value, document.getElementById('loginPass').value); };
    window.openVehicleModal = () => { editingVehicle = null; showVehicleModal = true; render(); };
    window.closeVehicleModal = () => { showVehicleModal = false; editingVehicle = null; render(); };
    window.editVehicle = (id) => { editingVehicle = JSON.parse(JSON.stringify(vehicles.find(v => v.id === id))); showVehicleModal = true; render(); };
    window.submitVehicle = async (e) => {
        e.preventDefault(); isUploading = true; render();
        const nome = document.getElementById('nome').value, marca = document.getElementById('marca').value, ano = parseInt(document.getElementById('ano').value), preco = parseInt(document.getElementById('preco').value), km = parseInt(document.getElementById('km').value), cor = document.getElementById('cor').value, combustivel = document.getElementById('combustivel').value, cambio = document.getElementById('cambio').value, descricao = document.getElementById('descricao').value;
        const previewDiv = document.getElementById('imagePreview'), imagensUrls = [];
        if (previewDiv) { const imgs = previewDiv.querySelectorAll('.gallery-item img'); for (let img of imgs) { if (img.src.startsWith('data:')) { const resp = await fetch(img.src); const blob = await resp.blob(); const file = new File([blob], 'carro.jpg'); const url = await uploadImageToCloudinary(file); imagensUrls.push(url); } else { imagensUrls.push(img.src); } } }
        if (editingVehicle) { const idx = vehicles.findIndex(v => v.id === editingVehicle.id); if (idx !== -1) { vehicles[idx] = { ...editingVehicle, nome, marca, ano, preco, km, cor, combustivel, cambio, descricao, imagens: imagensUrls.length ? imagensUrls : editingVehicle.imagens }; saveLocalData(); if (isAdmin) await saveVehiclesToGitHub(); showToast('✅ Atualizado!'); } }
        else { const newVehicle = { id: Date.now(), nome, marca, ano, preco, km, cor, combustivel, cambio, descricao, status: 'disponível', imagens: imagensUrls.length ? imagensUrls : ['https://placehold.co/800x450?text=Sem+Imagem'] }; vehicles.push(newVehicle); saveLocalData(); if (isAdmin) await saveVehiclesToGitHub(); showToast('✅ Adicionado!'); }
        isUploading = false; showVehicleModal = false; editingVehicle = null; render();
    };
    
    (async () => { isAdmin = localStorage.getItem('jm_admin') === 'true'; isDarkMode = localStorage.getItem('jm_darkMode') === 'true'; await loadVehiclesFromGitHub(); render(); })();
</script>
</body>
